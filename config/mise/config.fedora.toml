[bootstrap.packages]
"dnf:git" = "latest"
"dnf:fish" = "latest"
"dnf:eza" = "latest"
"dnf:starship" = "latest"
"dnf:niri" = "latest"
"dnf:quickshell" = "latest"
"dnf:fcitx5" = "latest"
"dnf:fcitx5-mozc" = "latest"
"dnf:uv" = "latest"
"dnf:firefox" = "latest"

[dotfiles]
"~/.config/mise" = { source = "." }
"~/.config/niri" = { source = "../niri" }
"~/.config/fish" = { source = "../fish" }
"~/.config/helix" = { source = "../helix" }
"~/.config/starship.toml" = { source = "../starship/starship.toml" }
"~/.config/quickshell" = { source = "../quickshell" }
"~/.zshrc" = { source = "../zsh/.zshrc" }
"~/.zshenv" = { source = "../zsh/.zshenv" }
