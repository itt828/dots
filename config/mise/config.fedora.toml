[bootstrap.packages]
"dnf:git" = "latest"
"dnf:fish" = "latest"
"dnf:eza" = "latest"
"dnf:starship" = "latest"
"dnf:niri" = "latest"
"dnf:quickshell" = "latest"
"dnf:fcitx5" = "latest"
"dnf:fcitx5-mozc" = "latest"
"dnf:uv" = "latest"
"dnf:firefox" = "latest"

[bootstrap.repos]
"~/repos/helix" = { url = "https://github.com/helix-editor/helix.git" }

[dotfiles]
"~/.config/mise" = { source = "." }
"~/.config/niri" = { source = "../niri" }
"~/.config/fish" = { source = "../fish" }
"~/.config/helix" = { source = "../helix", mode = "symlink-each", exclude = ["runtime", ".gitignore"] }
"~/.config/helix/runtime/queries" = { source = "~/repos/helix/runtime/queries" }
"~/.config/helix/runtime/themes" = { source = "~/repos/helix/runtime/themes" }
"~/.config/starship.toml" = { source = "../starship/starship.toml" }
"~/.config/quickshell" = { source = "../quickshell" }
"~/.zshrc" = { source = "../zsh/.zshrc" }
"~/.zshenv" = { source = "../zsh/.zshenv" }
"~/.local/bin/niri-mirror" = {source = "../../scripts/niri-mirror"}
