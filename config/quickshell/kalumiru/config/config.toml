[settings]
# Empty means all connected screens.
target_screens = ["eDP-1"]
animation_duration = 200
debug = false
# When an external monitor is active, keep the session usable with the lid closed.
lid_clamshell_mode = false

[theme]
palette = "kalumiru" # kalumiru | catppuccin | icon-v4
mode = "light" # light | dark

[search.shortcuts]
# Use desktop entry IDs, including the .desktop suffix.
apps = [
    "org.mozilla.firefox.desktop",
    "discord.desktop",
    "net.thunderbird.Thunderbird.desktop",
    "logseq.desktop",
    "chatgpt.desktop",
]
tools = ["lens"]
