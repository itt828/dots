include themes/catppuccin/latte-custom.conf

timeout 20

resolution max

use_nvram false

enable_mouse
mouse_size 24
mouse_speed 8

also_scan_dirs + root/boot

dont_scan_dirs + EFI/BOOT
dont_scan_files + EFI/fedora/grubx64.efi

use_graphics_for linux,windows

hideui singleuser,hints,arrows,badges,safemode,hwtest
